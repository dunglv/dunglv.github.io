<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZData - Kho Dữ Liệu Cá Nhân</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.6em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.05em;
            opacity: 0.9;
        }

        .panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
        }

        .password-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .password-row input[type="password"],
        .password-row input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .password-row input:focus {
            border-color: #764ba2;
        }

        .password-row button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: #f0f0f5;
            color: #333;
            cursor: pointer;
            font-size: 1em;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.9em;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border-radius: 14px;
            background: #f7f7fb;
            border: 1px solid #ececf5;
        }

        .file-icon {
            font-size: 2em;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-weight: 700;
            color: #333;
            word-break: break-word;
        }

        .file-meta {
            color: #888;
            font-size: 0.85em;
            margin-top: 2px;
        }

        .download-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95em;
            white-space: nowrap;
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty-state,
        .load-error {
            text-align: center;
            color: #888;
            padding: 30px 0;
        }

        .status-msg {
            margin-top: 14px;
            font-size: 0.9em;
            text-align: center;
        }

        .status-msg.error {
            color: #c0392b;
        }

        .status-msg.success {
            color: #27ae60;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🔒 ZData</h1>
            <p class="subtitle">File được mã hoá AES-256-GCM — cần mật khẩu đúng mới giải mã và tải xuống được</p>
        </header>

        <div class="panel">
            <div class="password-row">
                <input type="password" id="passwordInput" placeholder="Nhập mật khẩu..." autocomplete="off">
                <button type="button" id="toggleVisibility" title="Hiện/ẩn mật khẩu">👁️</button>
            </div>
            <div class="remember-row">
                <input type="checkbox" id="rememberSession">
                <label for="rememberSession">Ghi nhớ trong phiên duyệt web này (tự xoá khi đóng tab)</label>
            </div>
        </div>

        <div class="panel">
            <div id="fileList" class="file-list">
                <div class="empty-state">Đang tải danh sách file...</div>
            </div>
            <div id="statusMsg" class="status-msg"></div>
        </div>

        <footer>
            <p>Dữ liệu tại đây chỉ đọc được nếu biết đúng mật khẩu do người quản trị chia sẻ riêng.</p>
        </footer>
    </div>

    <script>
        const SALT_LEN = 16;
        const IV_LEN = 12;
        const ITERATIONS = 100000;

        const passwordInput = document.getElementById('passwordInput');
        const rememberCheckbox = document.getElementById('rememberSession');
        const toggleVisibilityBtn = document.getElementById('toggleVisibility');
        const fileListEl = document.getElementById('fileList');
        const statusMsgEl = document.getElementById('statusMsg');

        const ICON_MAP = {
            pdf: '📄', zip: '🗜️', rar: '🗜️', '7z': '🗜️',
            png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', webp: '🖼️',
            txt: '📝', json: '🧾', csv: '📊',
            xlsx: '📊', xls: '📊', docx: '📃', doc: '📃', pptx: '📽️',
            mp4: '🎬', mp3: '🎵',
        };

        function getIcon(name) {
            const ext = (name.split('.').pop() || '').toLowerCase();
            return ICON_MAP[ext] || '📦';
        }

        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return `${(bytes / Math.pow(1024, i)).toFixed(1)} ${units[i]}`;
        }

        function setStatus(message, type) {
            statusMsgEl.textContent = message;
            statusMsgEl.className = 'status-msg' + (type ? ' ' + type : '');
        }

        toggleVisibilityBtn.addEventListener('click', () => {
            passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
        });

        const cachedPassword = sessionStorage.getItem('zdata_password');
        if (cachedPassword) {
            passwordInput.value = cachedPassword;
            rememberCheckbox.checked = true;
        }

        function getPassword() {
            const value = passwordInput.value;
            if (rememberCheckbox.checked && value) {
                sessionStorage.setItem('zdata_password', value);
            } else {
                sessionStorage.removeItem('zdata_password');
            }
            return value;
        }

        async function deriveKey(password, salt) {
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        async function decryptBuffer(buffer, password) {
            const bytes = new Uint8Array(buffer);
            const salt = bytes.slice(0, SALT_LEN);
            const iv = bytes.slice(SALT_LEN, SALT_LEN + IV_LEN);
            const data = bytes.slice(SALT_LEN + IV_LEN);
            const key = await deriveKey(password, salt);
            return crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
        }

        function triggerDownload(buffer, filename, mimeType) {
            const blob = new Blob([buffer], { type: mimeType || 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }

        async function handleDownload(entry, button) {
            const password = getPassword();
            if (!password) {
                setStatus('Vui lòng nhập mật khẩu trước khi tải.', 'error');
                passwordInput.focus();
                return;
            }

            const originalLabel = button.textContent;
            button.disabled = true;
            button.textContent = 'Đang giải mã...';
            setStatus('', '');

            try {
                const res = await fetch(`files/${entry.encFile}`);
                if (!res.ok) throw new Error('Không tải được file mã hoá.');
                const encryptedBuffer = await res.arrayBuffer();
                const decrypted = await decryptBuffer(encryptedBuffer, password);
                triggerDownload(decrypted, entry.originalName, entry.mimeType);
                setStatus(`Đã tải "${entry.displayName}" thành công.`, 'success');
            } catch (err) {
                setStatus('Sai mật khẩu hoặc file bị lỗi.', 'error');
            } finally {
                button.disabled = false;
                button.textContent = originalLabel;
            }
        }

        function renderFiles(manifest) {
            if (!manifest.length) {
                fileListEl.innerHTML = '<div class="empty-state">Chưa có file nào được chia sẻ.</div>';
                return;
            }

            fileListEl.innerHTML = '';
            manifest.forEach((entry) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <span class="file-icon">${getIcon(entry.originalName)}</span>
                    <div class="file-info">
                        <div class="file-name">${entry.displayName}</div>
                        <div class="file-meta">${formatBytes(entry.size)}</div>
                    </div>
                    <button class="download-btn" type="button">Tải xuống</button>
                `;
                item.querySelector('.download-btn').addEventListener('click', (e) => {
                    handleDownload(entry, e.currentTarget);
                });
                fileListEl.appendChild(item);
            });
        }

        fetch('files/manifest.json')
            .then((res) => res.json())
            .then(renderFiles)
            .catch(() => {
                fileListEl.innerHTML = '<div class="load-error">Không tải được danh sách file.</div>';
            });
    </script>
</body>

</html>
